<script>
// Account rep shown under "Contact my account rep". PLACEHOLDER phone: swap these two lines for the real contact.
const REP_NAME='William Griffin';
const REP_PHONE='(850) 555-0100';
// ---- Rule-based quote rewriter (shared by app + script) ----
var RW_SPECIES=['live oak','water oak','laurel oak','red oak','white oak','crepe myrtle','crape myrtle','sweetgum','sweet gum','magnolia','hickory','cypress','cedar','dogwood','maple','pecan','palm','pine','oak','elm','birch','holly','sycamore','poplar','willow','bamboo'];
var RW_SVC=[[/\b(emergency|storm|fallen|down(ed)? tree)\b/,'24-Hour Emergency Service'],[/\bstump/,'Stump Grinding'],[/\b(remov\w*|take down|takedown|cut down|fell\w*)\b/,'Removal'],[/\bprun\w*/,'Pruning'],[/\b(trim\w*|thin\w*|raise|lift|clearance)\b/,'Trimming'],[/\b(haul\w*|clean ?up|debris|brush)\b/,'Debris Haul-Away & Cleanup'],[/\bpermit/,'Permit Paperwork'],[/\b(assess\w*|inspect\w*|evaluat\w*)\b/,'Tree Health Assessment'],[/\b(cabl\w*|brac\w*)\b/,'Cabling & Bracing'],[/\b(lot clear\w*|land clear\w*)\b/,'Lot Clearing']];
function rwTitle(s){return s.replace(/\b[a-z]/g,function(c){return c.toUpperCase()}).replace(/\b(And|Of|The|By|To|In|On|At|With|A)\b/g,function(w,x,i){return i?w.toLowerCase():w})}
function rwSentence(s){s=s.replace(/\s+/g,' ').trim();return s?s.charAt(0).toUpperCase()+s.slice(1)+(/[.!?]$/.test(s)?'':'.'):''}
function rwPrice(s){var m=s.match(/\$\s?(\d[\d,]*(\.\d{1,2})?)\s*k?\b/i)||s.match(/(?:^|\s)(\d[\d,]{1,}(\.\d{1,2})?)\s*(dollars|bucks)?\s*$/i);
  if(!m)return {p:null,rest:s};var v=parseFloat(m[1].replace(/,/g,''));if(/k\b/i.test(m[0]))v*=1000;return {p:v,rest:s.replace(m[0],' ')}}
function rwItem(raw){var pr=rwPrice(raw),t=pr.rest.toLowerCase().replace(/\s+/g,' ').trim(),sp='',svc=[],dead=/\b(dead|dying|leaning|hazard\w*)\b/.exec(t),n=/\b(\d+|two|three|four|five)\s+(trees|oaks|pines|palms|stumps)\b/.exec(t);
  for(var i=0;i<RW_SPECIES.length;i++)if(t.indexOf(RW_SPECIES[i])>=0){sp=RW_SPECIES[i].replace('crape','crepe').replace('sweet gum','sweetgum');break}
  RW_SVC.forEach(function(r){if(r[0].test(t)&&svc.indexOf(r[1])<0)svc.push(r[1])});
  if(!sp&&/\btrees?\b/.test(t))sp=' ';
  var title;if(!svc.length)title=rwTitle(t.replace(/[.]+$/,''))||'Tree Service';
  else{var tree=svc.filter(function(x){return /Removal|Pruning|Trimming|Cabling/.test(x)}),other=svc.filter(function(x){return tree.indexOf(x)<0});
    var head=tree.length?((dead?rwTitle(dead[1])+' ':'')+(sp.trim()?rwTitle(sp)+' ':'')+'Tree '+tree.join(' & ')):'';
    title=[head].concat(other).filter(Boolean).join(' & ');if(n)title+=' ('+n[1]+')';}
  return {title:title,detail:rwSentence(pr.rest),price:pr.p}}
function rewriteQuote(raw){return String(raw||'').split(/\n|;|,(?!\d{3})|\+|\band then\b|\balso\b|(?<=\d)\s+and\b/i).map(function(s){return s.trim()}).filter(function(s){return s.length>1}).map(rwItem)
  .reduce(function(a,it){if(a.length&&it.price==null&&a[a.length-1].price==null&&false)return a;a.push(it);return a},[])}
function money(v){return v==null||isNaN(v)?'':'$'+Number(v).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2})}
// An address needs a street name, not just a house number (a bare '3660' was saved once).
function addrBad(a){a=String(a||'').trim();return !!a&&!/[a-z]{2,}/i.test(a.split(',')[0])}
function validEmail(e){return /^[^\s@,;]+@[^\s@,;]+\.[a-z]{2,}$/i.test(String(e||'').trim())}

let API=new URLSearchParams(location.search).get('api')||localStorage.fdApi||'https://script.google.com/macros/s/AKfycbwQDIAb7fwXFVL6g9AjA-tKGoUcwal0-tozzbwJ4EOcNnaHE4AcqUOxdXuNMvRpKYJAlw/exec';
if(API)localStorage.fdApi=API;
const ROLES={'1234':'Manager','0123':'Crew','6789':'Admin'};
let blocks=[],role=sessionStorage.fdRole||'',jobs=[],root='',cur=null,pin='',photos=[],view='',SET=null,FORM=null,MAIL=null;
const $=s=>document.querySelector(s),A=$('#app');
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function toast(t){const e=$('#toast');e.textContent=t;e.style.display='block';clearTimeout(e.t);e.t=setTimeout(()=>e.style.display='none',3500)}
// Busy saves are retried up to 2 times with backoff. Actions that send email or texts are NEVER auto-retried.
const SENDS={sendQuoteText:1,create:1,finish:1,invoice:1,resend:1,smsOnWay:1};
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
async function api(body){if(!API)throw Error('Backend not connected yet');
 const P=myPin();if(body&&body.pin==null)body=Object.assign({pin:P},body);
 const sends=!!(body&&(SENDS[body.a]||body.send));
 for(let n=0;;n++){let j;
  try{const r=body?await fetch(API,{method:'POST',headers:{'Content-Type':'text/plain'},body:JSON.stringify(body)}):await fetch(API+(API.indexOf('?')<0?'?':'&')+'pin='+encodeURIComponent(P));j=await r.json()}
  catch(e){if(!body&&n<2){await sleep(1200*(n+1));continue}throw Error(sends?'No answer from the server. Check the job before sending again so the customer is not emailed twice.':'The server did not answer. Please try again.')}
  if(j.ok===false&&j.busy&&!sends&&n<2){await sleep(1000*(n+1)+Math.random()*800);continue}
  if(j.ok===false)throw Error(j.busy&&sends?'The app is busy. Nothing was sent. Please try again in a few seconds.':j.err);return j}}
async function archiveJob(id){if(!confirm('Archive this job? It will be hidden from all lists.'))return;
 try{await api({a:'archive',id});toast('Job archived');await refresh();cur=null;render();window.scrollTo(0,0)}catch(e){toast(e.message)}}
async function refresh(){try{const d=await api();jobs=(d.jobs||[]).filter(j=>!j.archived);root=d.root;blocks=d.blocks||[];if(d.settings)SET=d.settings;saveCache()}catch(e){toast(e.message)}}
// Last job list on this device (cleared on sign out) so the home screen shows instantly, then refreshes in the background.
function saveCache(){try{localStorage.fdCache=JSON.stringify({role,jobs,blocks,root,settings:SET,at:Date.now()})}catch(e){}}
function loadCache(){try{const c=JSON.parse(localStorage.fdCache||'null');if(!c||c.role!==role)return false;jobs=c.jobs||[];blocks=c.blocks||[];root=c.root||'';SET=c.settings||SET;return true}catch(e){return false}}
function onListScreen(){return !!$('#jl')&&(view===''||view==='fq')&&!SEL&&!DIRTY&&!(document.activeElement&&document.activeElement.id==='find')}
function roleLabel(r){return r==='Manager'?'Estimator':r}
function logout(){try{localStorage.removeItem('fdCache')}catch(e){}SEL=null;selBar();sessionStorage.fdRole='';sessionStorage.fdPin='';role='';cur=null;view='';render()}
function shrink(f){return new Promise(res=>{const i=new Image();i.onload=()=>{const m=1400,s=Math.min(1,m/Math.max(i.width,i.height)),c=document.createElement('canvas');c.width=i.width*s;c.height=i.height*s;c.getContext('2d').drawImage(i,0,0,c.width,c.height);res(c.toDataURL('image/jpeg',.75))};i.src=URL.createObjectURL(f)})}
async function pick(inp,cb){for(const f of inp.files)photos.push(await shrink(f));inp.value='';cb()}
function mic(btnId,fieldId){const SR=window.SpeechRecognition||window.webkitSpeechRecognition,b=$('#'+btnId),q=$('#'+fieldId);
 if(!b||!q)return;if(!SR){b.onclick=()=>toast('Voice not supported here. Use the keyboard mic.');return}
 let r=null;b.onclick=()=>{if(r){r.stop();return}r=new SR();r.lang='en-US';r.continuous=true;r.interimResults=false;
  r.onresult=e=>{for(let i=e.resultIndex;i<e.results.length;i++)if(e.results[i].isFinal)q.value+=(q.value?' ':'')+e.results[i][0].transcript.trim()};
  const ic=b.classList.contains('cmic');r.onend=()=>{r=null;b.classList.remove('on');b.textContent=ic?'🎤':'🎤 Talk'};r.start();b.classList.add('on');b.textContent=ic?'⏹':'⏹ Stop'}}
let GAL=[];function src(p){return typeof p=='string'?p:'https://lh3.googleusercontent.com/d/'+p.id+'=w1000'}
function imgs(l){l=l||[];const s=GAL.length;GAL.push(...l);return '<div class="ph">'+l.map((p,i)=>`<img loading="lazy" src="${esc(src(p))}" data-id="${p.id||''}" onerror="fb(this)" onclick="big(${s+i})">`).join('')+'</div>'}
async function fb(im){if(im.dataset.tried||!im.dataset.id)return;im.dataset.tried=1;try{const r=await fetch(API+'?a=img&id='+im.dataset.id+'&pin='+encodeURIComponent(myPin()));const j=await r.json();im.src=j.data}catch(e){}}

const TLH={lat:30.4383,lon:-84.2807},AREA=[-86.6,29.5,-81.9,31.9]; // North Florida + South Georgia
const ACC=new Map();function acGet(k){if(ACC.has(k))return ACC.get(k);try{const v=sessionStorage.getItem('ac:'+k);if(v){const l=JSON.parse(v);ACC.set(k,l);return l}}catch(e){}return null}

// Google Places (New) browser key: restricted by HTTP referrer to austin-tss.github.io and localhost, Places API (New) only.
const PLACES_KEY='AIzaSyC8j6_kOsgrlox57bVgof4vrbMEYz2RnsU';
// Local test runs on 127.0.0.1 never call Google or Photon unless ?ac=1 is in the address.
const AC_OFF=location.hostname==='127.0.0.1'&&!/[?&]ac=1/.test(location.search);
function placesKey(){return (SET&&SET.placesKey)||PLACES_KEY}
let GSESS='';function gSession(){if(!GSESS)GSESS=(crypto.randomUUID?crypto.randomUUID():String(Date.now())+Math.random());return GSESS}
async function gPlaces(q,sig){const g=GEO||TLH;const r=await fetch('https://places.googleapis.com/v1/places:autocomplete',{method:'POST',signal:sig,headers:{'Content-Type':'application/json','X-Goog-Api-Key':placesKey()},
  body:JSON.stringify({input:q,sessionToken:gSession(),includedRegionCodes:['us'],locationBias:{circle:{center:{latitude:g.lat,longitude:g.lon},radius:50000}}})});if(!r.ok)throw Error('places');

async function photon(q,sig){const g=GEO||TLH,tn=(q.match(/^\s*(\d{1,6})\b/)||[])[1];
 const r=await fetch('https://photon.komoot.io/api/?limit=6&lang=en&lat='+g.lat+'&lon='+g.lon+'&bbox='+AREA.join(',')+'&q='+encodeURIComponent(q),{signal:sig});if(!r.ok)throw Error('photon');
 const j=await r.json();return (j.features||[]).filter(f=>(f.properties.countrycode||'').toUpperCase()=='US').map(f=>{const p=f.properties;return fmtAddr({num:p.housenumber||(!p.street&&p.type=='street'&&p.name&&!/^\d/.test(p.name)?tn:''),street:p.street,name:p.street?'':p.name,city:p.city||p.town||p.village||p.county,state:p.state,zip:p.postcode})})}
async function nominatim(q,sig){const r=await fetch('https://nominatim.openstreetmap.org/search?format=jsonv2&addressdetails=1&limit=6&countrycodes=us&bounded=0&viewbox='+[AREA[0],AREA[3],AREA[2],AREA[1]].join(',')+'&q='+encodeURIComponent(q),{signal:sig});if(!r.ok)throw Error('nominatim');
 return (await r.json()).map(x=>{const a=x.address||{};return fmtAddr({num:a.house_number,street:a.road,name:a.road?'':x.name,city:a.city||a.town||a.village||a.hamlet||a.county,state:a.state,zip:a.postcode})})}
async function lookup(q,sig){const k=(placesKey()?'g:':'o:')+q.toLowerCase();const hit=acGet(k);if(hit)return hit;let l=[];
 if(placesKey()){try{l=await gPlaces(q,sig)}catch(e){if(e.name==='AbortError')throw e;l=[]}}
 if(!l.length){try{l=await photon(q,sig)}catch(e){if(e.name==='AbortError')throw e}
  if(!l.length||/^\s*\d{1,6}\b/.test(q)&&!l.some(x=>/^\d/.test(x))){try{l=[...(await nominatim(q,sig)),...l]}catch(e){if(e.name==='AbortError')throw e}}
  const rk=s=>/, FL\b/.test(s)?0:/, GA\b/.test(s)?1:/, AL\b/.test(s)?2:3;
  l=[...new Set(l.filter(x=>x&&!addrBad(x)&&x.indexOf(',')>0))].map((s,i)=>[s,i]).sort((a,b)=>rk(a[0])-rk(b[0])||a[1]-b[1]).map(x=>({label:x[0]})).slice(0,6)}
 acPut(k,l);return l}

function customerKey(j){var em=String(j.email||'').trim().toLowerCase();return em||(String(j.name||'').trim().toLowerCase()+'|'+String(j.address||'').trim().toLowerCase())}

async function saveCustomer(){if(addrBad($('#cad').value))return toast('Add the full address: street, city, state, zip');var email=$('#cem').value.trim();if(email&&!validEmail(email))return toast('That email does not look right');if(!email)return toast('Customer email is required');var b=$('#csave');if(b){b.disabled=true;b.textContent='Saving…'}try{await api({a:'cedit',pin:myPin(),ids:window.CIDS||[],name:$('#cnm').value.trim(),phone:$('#cph').value.trim(),email:email,address:$('#cad').value.trim(),phone2:$('#cph2').value.trim(),contact2:$('#cct2').value.trim()});toast('Customer saved');await refresh();var id=(window.CIDS||[])[0];if(id&&role==='Admin')aview(id);else if(id)mview(id);else render()}catch(e){toast(String(e.message||e)==='Bad action'?'Editing needs a Field Desk script redeploy before it can be saved.':e.message);if(b){b.disabled=false;b.textContent='Save customer'}}}
async function saveEdit(send){if($('#ad')&&addrBad($('#ad').value))return toast('Add the full address: street, city, state, zip');var id=editId;if(!id)return;var d=Object.assign({a:'qedit',id:id,send:!!send,name:$('#nm')?$('#nm').value.trim():'',address:$('#ad')?$('#ad').value.trim():'',email:$('#em')?$('#em').value.trim():'',quote:$('#qt')?$('#qt').value:'',items:IT.filter(function(i){return i.title&&String(i.title).trim()})},quoteExtra());if(d.email&&!validEmail(d.email))return toast('That email does not look right');if(!d.email)return toast('Customer email is required');if(!d.items.length)return toast('Add at least one line');var b=send?$('#sq'):$('#sqsave');var other=send?$('#sqsave'):$('#sq');if(b){b.disabled=true;b.textContent=send?'Sending…':'Saving…'}if(other)other.disabled=true;try{await api(d);editId='';toast(send?'Updated estimate sent to '+d.email:'Quote saved');await refresh();if(role==='Admin')aview(id);else mview(id)}catch(e){toast(String(e.message||e)==='Bad action'?'Editing needs a Field Desk script redeploy before it can be saved.':e.message);if(b){b.disabled=false;b.textContent=send?'Send updated estimate':'Save'}if(other)other.disabled=false}}
async function saveInv(id){try{await api({a:'iedit',id:id,amount:$('#am').value,note:$('#an').value});toast('Invoice saved');await refresh();aview(id)}catch(e){toast(String(e.message||e)==='Bad action'?'Editing needs a Field Desk script redeploy before it can be saved.':e.message)}}
function openRep(){view='rep';repScreen();window.scrollTo(0,0)}
function repScreen(){const tel=REP_PHONE.replace(/[^\d+]/g,'');A.innerHTML=`<div class="card" id="repcard"><h2>Your account rep</h2><p style="font-size:24px;font-weight:800;color:var(--n);margin:4px 0">${esc(REP_NAME)}</p><p style="font-size:20px;margin:0 0 6px">${esc(REP_PHONE)}</p><a class="btn huge" id="repcall" href="tel:${tel}" style="text-decoration:none;text-align:center">📞 Call</a><a class="btn huge n" id="reptext" href="sms:${tel}" style="text-decoration:none;text-align:center">💬 Text</a></div>`;armBack(function(){view='';render()})}
function openFb(){view='fb';feedbackScreen();window.scrollTo(0,0)}
function feedbackScreen(){A.innerHTML='<div class="card"><h2>Feedback for the development team</h2><p class="muted">Tell the development team what to change in Field Desk. Your note goes straight to them.</p><textarea id="fbtext" rows="6" placeholder="What should we change?"></textarea><button class="btn huge" id="fbsend" type="button" onclick="sendFeedback()">Send to the development team</button></div>';armBack(function(){view='';render()})}
async function sendFeedback(){var text=$('#fbtext')?$('#fbtext').value.trim():'';if(!text)return toast('Write a note first');var b=$('#fbsend');if(b){b.disabled=true;b.textContent='Sending…'}try{await api({a:'feedback',pin:myPin(),role:role,text:text});if($('#fbtext'))$('#fbtext').value='';toast('Sent to the development team. Thank you!')}catch(e){toast(String(e.message||e)==='Bad action'?'Feedback needs a Field Desk script redeploy before it can be saved.':e.message)}if(b){b.disabled=false;b.textContent='Send to the development team'}}
function prev(){var spoken=$('#qt')?$('#qt').value.trim():'';var svc=$('#svc')?$('#svc').value:'';if(!spoken&&!svc)return toast('Say or type the work first');IT=FDForm.buildLines(formCfg(),svc,spoken?rewriteQuote(spoken):[]);drawPv()}
function drawPv(){var t=IT.reduce(function(a,i){return a+(Number(i.price)||0)},0);var face=FDForm.customerPreviewHtml(quoteFace(),formCfg());var sendBtn=editId?'<button class="btn huge" id="sqsave" type="button" onclick="saveEdit(false)">Save</button><button class="btn huge d" id="sq" type="button" onclick="saveEdit(true)">Send updated estimate</button>':'<p style="font-weight:700;margin:14px 0 4px">How should the customer get it?</p><button class="btn huge" id="sq" type="button" onclick="sendQ()">📧 Email quote + PDF</button><button class="btn huge n" id="sqt" type="button" onclick="sendQT()">💬 Text a link</button><p class="muted" id="sqtnote"></p>';$('#pv').innerHTML='<div class="card" style="border:3px solid var(--g)"><h2>Customer will see</h2><p class="muted">Edit anything. Blank price = Included. Internal notes are not in this box.</p>'+face+IT.map(function(i,n){return '<div style="border-bottom:1px solid #e6e9e0;padding:8px 0"><input value="'+esc(i.title)+'" oninput="IT['+n+'].title=this.value" style="font-weight:700"><textarea rows="2" oninput="IT['+n+'].detail=this.value" style="margin-top:6px;font-size:15px">'+esc(i.detail)+'</textarea><div class="row"><input inputmode="decimal" placeholder="Price" value="'+(i.price==null?'':i.price)+'" oninput="IT['+n+'].price=this.value===\'\'?null:Number(this.value.replace(/[$,]/g,\'\'));$(\'#tot\').textContent=money(IT.reduce(function(a,i){return a+(Number(i.price)||0)},0))"><button class="btn gr" style="margin:0;flex:0 0 90px" onclick="IT.splice('+n+',1);drawPv()">Remove</button></div></div>'}).join('')+'<button class="btn gr" onclick="IT.push({title:\'\',detail:\'\',price:null});drawPv()">+ Add line</button><p style="font-size:22px;text-align:right"><b>Total: <span id="tot">'+money(t)+'</span></b></p>'+sendBtn+'</div>';if(!editId){txtState();if($('#ph'))$('#ph').oninput=txtState;$('#pv').scrollIntoView({behavior:'smooth'})}}
if(role){if(loadCache()){render();refresh().then(()=>{if(onListScreen())render()})}else refresh().then(render)}else render();
if('serviceWorker' in navigator&&(location.protocol==='https:'||/^(localhost|127\.0\.0\.1)$/.test(location.hostname)))navigator.serviceWorker.register('sw.js').catch(()=>{});
