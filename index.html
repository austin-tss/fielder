<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">

<style>

:root{--n:#112337;--g:#78a22f;--dg:#34460d;--c:#231f20}

</style></head><body>

<script src="form.js?v=20261027q"></script>
<script>
// ---- Rule-based quote rewriter (shared by app + script) ----
var RW_SPECIES=['live oak','water oak','laurel oak','red oak','white oak','crepe myrtle','crape myrtle','sweetgum','sweet gum','magnolia','hickory','cypress','cedar','dogwood','maple','pecan','palm','pine','oak','elm','birch','holly','sycamore','poplar','willow','bamboo'];
var RW_SVC=[[/\b(emergency|storm|fallen|down(ed)? tree)\b/,'24-Hour Emergency Service'],[/\bstump/,'Stump Grinding'],[/\b(remov\w*|take down|takedown|cut down|fell\w*)\b/,'Removal'],[/\bprun\w*/,'Pruning'],[/\b(trim\w*|thin\w*|raise|lift|clearance)\b/,'Trimming'],[/\b(haul\w*|clean ?up|debris|brush)\b/,'Debris Haul-Away & Cleanup'],[/\bpermit/,'Permit Paperwork'],[/\b(assess\w*|inspect\w*|evaluat\w*)\b/,'Tree Health Assessment'],[/\b(cabl\w*|brac\w*)\b/,'Cabling & Bracing'],[/\b(lot clear\w*|land clear\w*)\b/,'Lot Clearing']];
function rwTitle(s){return s.replace(/\b[a-z]/g,function(c){return c.toUpperCase()}).replace(/\b(And|Of|The|By|To|In|On|At|With|A)\b/g,function(w,x,i){return i?w.toLowerCase():w})}
function rwSentence(s){s=s.replace(/\s+/g,' ').trim();return s?s.charAt(0).toUpperCase()+s.slice(1)+(/[.!?]$/.test(s)?'':'.'):''}
function rwPrice(s){var m=s.match(/\$\s?(\d[\d,]*(\.\d{1,2})?)\s*k?\b/i)||s.match(/(?:^|\s)(\d[\d,]{1,}(\.\d{1,2})?)\s*(dollars|bucks)?\s*$/i);
  if(!m)return {p:null,rest:s};var v=parseFloat(m[1].replace(/,/g,''));if(/k\b/i.test(m[0]))v*=1000;return {p:v,rest:s.replace(m[0],' ')}}
function rwItem(raw){var pr=rwPrice(raw),t=pr.rest.toLowerCase().replace(/\s+/g,' ').trim(),sp='',svc=[],dead=/\b(dead|dying|leaning|hazard\w*)\b/.exec(t),n=/\b(\d+|two|three|four|five)\s+(trees|oaks|pines|palms|stumps)\b/.exec(t);
  for(var i=0;i<RW_SPECIES.length;i++)if(t.indexOf(RW_SPECIES[i])>=0){sp=RW_SPECIES[i].replace('crape','crepe').replace('sweet gum','sweetgum');break}
  RW_SVC.forEach(function(r){if(r[0].test(t)&&svc.indexOf(r[1])<0)svc.push(r[1])});
  if(!sp&&/\btrees?\b/.test(t))sp=' ';
  var title;if(!svc.length)title=rwTitle(t.replace(/[.]+$/,''))||'Tree Service';
  else{var tree=svc.filter(function(x){return /Removal|Pruning|Trimming|Cabling/.test(x)}),other=svc.filter(function(x){return tree.indexOf(x)<0});
    var head=tree.length?((dead?rwTitle(dead[1])+' ':'')+(sp.trim()?rwTitle(sp)+' ':'')+'Tree '+tree.join(' & ')):'';
    title=[head].concat(other).filter(Boolean).join(' & ');if(n)title+=' ('+n[1]+')';}
  return {title:title,detail:rwSentence(pr.rest),price:pr.p}}
function rewriteQuote(raw){return String(raw||'').split(/\n|;|,(?!\d{3})|\+|\band then\b|\balso\b|(?<=\d)\s+and\b/i).map(function(s){return s.trim()}).filter(function(s){return s.length>1}).map(rwItem)
  .reduce(function(a,it){if(a.length&&it.price==null&&a[a.length-1].price==null&&false)return a;a.push(it);return a},[])}
function money(v){return v==null||isNaN(v)?'':'$'+Number(v).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2})}
function validEmail(e){return /^[^\s@,;]+@[^\s@,;]+\.[a-z]{2,}$/i.test(String(e||'').trim())}

let API=new URLSearchParams(location.search).get('api')||localStorage.fdApi||'https://script.google.com/macros/s/AKfycbwQDIAb7fwXFVL6g9AjA-tKGoUcwal0-tozzbwJ4EOcNnaHE4AcqUOxdXuNMvRpKYJAlw/exec';
if(API)localStorage.fdApi=API;
const ROLES={'1234':'Manager','0123':'Crew','6789':'Admin'};
let blocks=[],role=sessionStorage.fdRole||'',jobs=[],root='',cur=null,pin='',photos=[],view='',SET=null,FORM=null,MAIL=null;
const $=s=>document.querySelector(s),A=$('#app');
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function toast(t){const e=$('#toast');e.textContent=t;e.style.display='block';clearTimeout(e.t);e.t=setTimeout(()=>e.style.display='none',3500)}
async function api(body){if(!API)throw Error('Backend not connected yet');
 const r=body?await fetch(API,{method:'POST',headers:{'Content-Type':'text/plain'},body:JSON.stringify(body)}):await fetch(API);
 const j=await r.json();if(j.ok===false)throw Error(j.err);return j}
async function refresh(){try{const d=await api();jobs=d.jobs;root=d.root;blocks=d.blocks||[];if(d.settings)SET=d.settings}catch(e){toast(e.message)}}
function logout(){sessionStorage.fdRole='';role='';cur=null;view='';render()}
function shrink(f){return new Promise(res=>{const i=new Image();i.onload=()=>{const m=1400,s=Math.min(1,m/Math.max(i.width,i.height)),c=document.createElement('canvas');c.width=i.width*s;c.height=i.height*s;c.getContext('2d').drawImage(i,0,0,c.width,c.height);res(c.toDataURL('image/jpeg',.75))};i.src=URL.createObjectURL(f)})}
async function pick(inp,cb){for(const f of inp.files)photos.push(await shrink(f));inp.value='';cb()}
function mic(btnId,fieldId){const SR=window.SpeechRecognition||window.webkitSpeechRecognition,b=$('#'+btnId),q=$('#'+fieldId);
 if(!SR){b.onclick=()=>toast('Voice not supported here. Use the keyboard mic.');return}
 let r=null;b.onclick=()=>{if(r){r.stop();return}r=new SR();r.lang='en-US';r.continuous=true;r.interimResults=false;
  r.onresult=e=>{for(let i=e.resultIndex;i<e.results.length;i++)if(e.results[i].isFinal)q.value+=(q.value?' ':'')+e.results[i][0].transcript.trim()};
  r.onend=()=>{r=null;b.classList.remove('on');b.textContent='🎤 Talk'};r.start();b.classList.add('on');b.textContent='⏹ Stop'}}
let GAL=[];function src(p){return typeof p=='string'?p:'https://lh3.googleusercontent.com/d/'+p.id+'=w1000'}
function imgs(l){l=l||[];const s=GAL.length;GAL.push(...l);return '<div class="ph">'+l.map((p,i)=>`<img loading="lazy" src="${esc(src(p))}" data-id="${p.id||''}" onerror="fb(this)" onclick="big(${s+i})">`).join('')+'</div>'}
async function fb(im){if(im.dataset.tried||!im.dataset.id)return;im.dataset.tried=1;try{const r=await fetch(API+'?a=img&id='+im.dataset.id);const j=await r.json();im.src=j.data}catch(e){}}
let gi=0;function big(i){gi=i;const im=document.querySelector(`.ph img[onclick="big(${i})"]`);$('#lbi').src=im?im.src:src(GAL[i]);$('#lb').style.display='flex'}
function nav(d){big((gi+d+GAL.length)%GAL.length)}
function setupCard(){return API?'':`<div class="card"><h2>Connect backend</h2><p class="muted">Paste the Apps Script web app URL once.</p><input id="apiu" placeholder="https://script.google.com/macros/s/.../exec"><button class="btn n" onclick="localStorage.fdApi=API=$('#apiu').value.trim();render()">Save</button></div>`}
function themeName(){return SET&&SET.theme==='dark'?'dark':'classic'}
function applyTheme(){if(themeName()==='dark')document.documentElement.setAttribute('data-theme','dark');else document.documentElement.removeAttribute('data-theme')}
let BACKFN=null,editId='';
function armBack(fn){BACKFN=fn||null;var b=$('#back');if(b)b.hidden=!BACKFN}
function goBack(){if(BACKFN)BACKFN()}
function navHome(){view='';cur=null;editId='';armBack(null);render();window.scrollTo(0,0)}
function render(){GAL=[];applyTheme();if(view==='set'&&role!=='Manager')view='';if(view==='fb'&&!role)view='';$('#out').hidden=!role;$('#who').textContent=role?role+' view':'Tree Care & Service';
 if(!role){pin='';view='';editId='';armBack(null);A.innerHTML=setupCard()+`<div class="card"><h2>Enter your PIN</h2><div id="dots"></div><div class="pin">${[1,2,3,4,5,6,7,8,9,'⌫',0,'✓'].map(k=>`<button onclick="key('${k}')">${k}</button>`).join('')}</div></div>
 <p class="muted">Free estimates · 24 HR emergency · (850) 656-8737</p>`;return}
 if(view==='set')return setScreen();
 if(view==='fb')return feedbackScreen();
 ({Manager:mgr,Crew:crew,Admin:admin})[role]()}
function key(k){if(k=='⌫')pin=pin.slice(0,-1);else if(k=='✓'||pin.length<4){if(k!='✓')pin+=k}
 $('#dots').textContent='•'.repeat(pin.length);if(pin.length==4){if(ROLES[pin]){role=sessionStorage.fdRole=ROLES[pin];refresh().then(render);A.innerHTML='<div class="card">Loading…</div>'}else{toast('Wrong PIN');pin='';$('#dots').textContent=''}}}
function stat(j){if(j.status=='invoiced')return j.invoice&&j.invoice.paid?'paid':'invoiced';if(j.status=='approved')return j.crew&&j.crew.length?'inprogress':'approved';return j.status}
const SC={sent:'#112337',reply:'#7c3aed',approved:'#78a22f',inprogress:'#d97706',complete:'#34460d',invoiced:'#c2410c',paid:'#15803d',declined:'#8a8f98'};
const ST={paid:'Paid',inprogress:'In progress',sent:'Quoted',approved:'Approved → crew',declined:'Declined',reply:'Customer replied',complete:'Done → admin',invoiced:'Invoiced'};
function list(title,arr,go,extra=''){armBack(null);A.innerHTML=`${extra}<div class="card"><h2>${title}</h2>${arr.length?'':'<p class="muted">Nothing here right now.</p>'}${arr.map(j=>`<button class="btn n" style="text-align:left" onclick="${go}('${j.id}')">${esc(j.name)}<br><small style="font-weight:400">${maplink(j.address,1)} <span class="badge" style="background:${SC[stat(j)]}">${ST[stat(j)]}</span>${j.response?' · '+esc(j.response.label):''}${av(j)?'<br>🕒 '+esc(av(j)):''} ${role=='Manager'?cfBadge(j):''}</small></button>`).join('')}<button class="btn gr" onclick="refresh().then(render)">↻ Refresh</button></div>`+(root?`<p class="muted"><a href="${root}" target="_blank">Drive folder</a></p>`:'')+'<button class="btn n" id="fbhome" type="button" onclick="openFb()">Feedback</button>'}
function mapU(a,g){const e=encodeURIComponent(a);return g?'https://www.google.com/maps/dir/?api=1&destination='+e:'https://maps.apple.com/?daddr='+e}
function openMap(a,g){window.open(mapU(a,g),'_blank')}
function maplink(a,inBtn){a=String(a||'').trim();if(!a)return '';const q=esc(JSON.stringify(a));if(inBtn)return `<span class="maddr" role="link" onclick="event.stopPropagation();openMap(${q})">📍 ${esc(a)}</span> <span class="gmap" role="link" onclick="event.stopPropagation();openMap(${q},1)">Google Maps</span>`;return `<span class="addrline"><a class="maddr" href="${esc(mapU(a))}" target="_blank" rel="noopener">📍 ${esc(a)}</a> <a class="gmap" href="${esc(mapU(a,1))}" target="_blank" rel="noopener">Google Maps</a></span>`}
function av(j){const r=j.response||{};return [r.avail,r.when].filter(Boolean).join(' - ')}
// ---- schedule + conflicts ----
const DAYN=['sunday','monday','tuesday','wednesday','thursday','friday','saturday'],MON=['jan','feb','mar','apr','may','jun','jul','aug','sep','oct','nov','dec'];
function ymd(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function hm(s){const[a,b]=String(s).split(':');return +a+(+b||0)/60}
function hrs(t){t=t.toLowerCase();if(/morning|\bam\b/.test(t)&&!/\d/.test(t))return[8,12];if(/afternoon/.test(t))return[12,17];
 const m=t.match(/\b(\d{1,2})(?::(\d\d))?\s*(am|pm)?\b(?!\s*\/)/);if(m&&(m[3]||/\bat\b/.test(t))){let h=+m[1]+(+m[2]||0)/60;if(m[3]=='pm'&&h<12)h+=12;if(!m[3]&&h<7)h+=12;return[h,Math.min(h+3,17)]}
 if(/morning/.test(t))return[8,12];return[8,17]}
function windows(j,days=21){const r=j.response||{},a=r.avail||'',w=(r.when||'').trim(),out=[],t0=new Date();t0.setHours(0,0,0,0);
 if(w){const t=w.toLowerCase();let ds=[];const md=t.match(/\b(\d{1,2})\/(\d{1,2})\b/),mn=MON.findIndex(m=>new RegExp('\\b'+m+'[a-z]*\\.?\\s+(\\d{1,2})\\b').test(t));
  if(md){const d=new Date(t0.getFullYear(),+md[1]-1,+md[2]);if(d<t0)d.setFullYear(d.getFullYear()+1);ds=[d]}
  else if(mn>=0){const dn=+t.match(new RegExp('\\b'+MON[mn]+'[a-z]*\\.?\\s+(\\d{1,2})\\b'))[1],d=new Date(t0.getFullYear(),mn,dn);if(d<t0)d.setFullYear(d.getFullYear()+1);ds=[d]}
  else if(/tomorrow/.test(t)){const d=new Date(t0);d.setDate(d.getDate()+1);ds=[d]}
  else{const wd=DAYN.map((n,i)=>new RegExp('\\b'+n.slice(0,3)).test(t)?i:-1).filter(i=>i>=0);for(let i=1;i<=days;i++){const d=new Date(t0);d.setDate(d.getDate()+i);if(wd.includes(d.getDay()))ds.push(d)}}
  const[h1,h2]=hrs(t);ds.forEach(d=>out.push({d:ymd(d),s:h1,e:h2}));if(out.length)return out}
 const rule=/8-12/.test(a)?[1,8,12]:/12-5/.test(a)?[1,12,17]:/weekend/i.test(a)?[2,8,17]:a?[0,8,17]:null;if(!rule)return[];
 for(let i=1;i<=days;i++){const d=new Date(t0);d.setDate(d.getDate()+i);const we=d.getDay()==0||d.getDay()==6;if(rule[0]==1&&we||rule[0]==2&&!we)continue;out.push({d:ymd(d),s:rule[1],e:rule[2]})}return out}
function conflicts(j){const W=windows(j);if(!W.length)return null;const hit=[],open=[];
 W.forEach(w=>{const ov=blocks.filter(b=>b.date==w.d&&b.job!=j.id&&hm(b.start)<w.e&&hm(b.end)>w.s);(ov.length?hit:open).push({w,ov})});return{W,hit,open}}
function fmtD(s){const d=new Date(s+'T12:00');return d.toLocaleDateString('en-US',{weekday:'short',month:'short',day:'numeric'})}
function fmtT(s){let h=Math.floor(hm(s)),m=Math.round((hm(s)-h)*60);return((h%12)||12)+(m?':'+String(m).padStart(2,'0'):'')+(h<12?'a':'p')}
function cfBadge(j){if(['complete','invoiced','declined'].includes(j.status))return'';const c=conflicts(j);if(!c||!c.hit.length)return c?'<span class="badge" style="background:#15803d">Schedule open</span>':'';
 return `<span class="badge" style="background:${c.open.length?'#d97706':'#b91c1c'}">⚠ Schedule conflict${c.open.length?'':' – fully booked'}</span>`}
function cfDetail(j){const c=conflicts(j);if(!c)return'';const bn=b=>`${fmtD(b.date)} ${fmtT(b.start)}-${fmtT(b.end)} ${esc(b.note||(jobs.find(x=>x.id==b.job)||{}).name||'')}`;
 const uniq=[...new Map(c.hit.flatMap(h=>h.ov).map(b=>[b.id,b])).values()];
 return `<div class="card" style="border:3px solid ${c.hit.length?(c.open.length?'#d97706':'#b91c1c'):'#15803d'}"><h2>${c.hit.length?'⚠ Schedule conflict':'✓ Schedule open'}</h2><p class="muted">Checked next 3 weeks against their pick: <b>${esc(av(j))}</b></p>
 ${uniq.length?'<label>Overlapping blocks</label>'+uniq.map(b=>`<p style="margin:4px 0;color:#b91c1c">• ${bn(b)}</p>`).join(''):''}
 <label>Open days that fit</label>${c.open.length?c.open.slice(0,6).map(o=>`<p style="margin:4px 0;color:#15803d">• ${fmtD(o.w.d)} ${fmtT(String(o.w.s))}-${fmtT(String(o.w.e))}</p>`).join(''):'<p style="color:#b91c1c">None in the next 3 weeks</p>'}</div>`}
// Crew schedule (internal)
let SV={mode:'week',start:null};
function sched(){if(!SV.start){const d=new Date();d.setHours(0,0,0,0);d.setDate(d.getDate()-d.getDay());SV.start=d}
 const s=new Date(SV.start),n=SV.mode=='week'?7:42;if(SV.mode=='month'){s.setDate(1);s.setDate(1-s.getDay())}

async function photon(q){const g=GEO||{lat:30.44,lon:-84.28},tn=(q.match(/^\s*(\d{1,6})\b/)||[])[1];
 const r=await fetch('https://photon.komoot.io/api/?limit=8&lang=en&lat='+g.lat+'&lon='+g.lon+'&q='+encodeURIComponent(q),{signal:tmo(4500)});if(!r.ok)throw Error('photon');

function quoteFace(){var x=quoteExtra();return {service:x.service,species:x.species,timing:x.timing,access:x.access,phone:x.phone,additionalNotes:x.additionalNotes,internalNotes:x.internalNotes,custom:x.custom}}
function staffNotes(j){return (j.service?'<p><b>Service:</b> '+esc(j.service)+'</p>':'')+(j.species?'<p><b>Tree:</b> '+esc(j.species)+'</p>':'')+(j.timing?'<p><b>Timing:</b> '+esc(j.timing)+'</p>':'')+(j.access?'<p><b>Site access:</b> '+esc(j.access)+'</p>':'')+(j.additionalNotes?'<p><b>Notes for customer:</b> '+esc(j.additionalNotes)+'</p>':'')+(j.internalNotes?'<p><b>Internal notes:</b> '+esc(j.internalNotes)+' <span class="muted">Not on the customer estimate.</span></p>':'')}
function newq(pre){photos=[];view='';editId=pre&&pre.id?pre.id:'';var backTo=editId;var from=role;A.innerHTML='<div class="card"><h2>'+(editId?'Edit quote':'New quote')+'</h2>'+FDForm.quoteFieldsHtml(formCfg(),{emailNote:window.FD_EMAIL_NOTE||''})+'<button class="btn huge d" type="button" onclick="prev()">Preview polished quote →</button><div id="pv"></div><button class="btn gr" type="button" onclick="goBack()">Cancel</button></div>';if(pre)fillQuote(pre);if($('#mb')&&$('#qt'))mic('mb','qt');if($('#ad'))addrAC('ad');armBack(function(){editId='';if(backTo&&from==='Admin')aview(backTo);else if(backTo)mview(backTo);else render()})}
function ensureOption(id,value){var el=document.getElementById(id);if(!el||!value)return;if(![...el.options].some(function(o){return o.value===value||o.textContent===value})){var o=document.createElement('option');o.textContent=value;o.value=value;el.appendChild(o)}el.value=value}
function fillQuote(pre){if($('#nm'))$('#nm').value=pre.name||'';if($('#ad'))$('#ad').value=pre.address||'';if($('#em'))$('#em').value=pre.email||'';if($('#ph'))$('#ph').value=pre.phone||'';ensureOption('svc',pre.service||'');ensureOption('species',pre.species||'');ensureOption('timing',pre.timing||'');ensureOption('access',pre.access||'');if($('#qt'))$('#qt').value=pre.quote||'';if($('#addl'))$('#addl').value=pre.additionalNotes||'';if($('#inote'))$('#inote').value=pre.internalNotes||'';formCfg().fields.forEach(function(f){if(f.builtin)return;var el=document.getElementById('cx-'+f.id);if(!el||!pre.custom)return;if(el.type==='checkbox')el.checked=!!pre.custom[f.id];else el.value=pre.custom[f.id]||''});IT=(pre.items||[]).map(function(i){return {title:i.title||'',detail:i.detail||'',price:i.price==null||i.price===''?null:Number(i.price)}});if(IT.length)drawPv()}
function editQuote(id){var j=jobs.find(function(x){return x.id===id});if(!j)return;newq(j);window.scrollTo(0,0)}
const ROLEPIN={Manager:'1234',Crew:'0123',Admin:'6789',Owner:'1234'};
function myPin(){return ROLEPIN[role]||''}
function customerKey(j){var em=String(j.email||'').trim().toLowerCase();return em||(String(j.name||'').trim().toLowerCase()+'|'+String(j.address||'').trim().toLowerCase())}
function editCustomer(id){var j=jobs.find(function(x){return x.id===id});if(!j)return;var ids=jobs.filter(function(x){return customerKey(x)===customerKey(j)}).map(function(x){return x.id});var from=role;window.CIDS=ids;A.innerHTML='<div class="card"><h2>Edit customer</h2><p class="muted">This updates every job for this customer. Secondary phone and contact stay off the estimate.</p><label>Name</label><input id="cnm" value="'+esc(j.name||'')+'"><label>Phone</label><input id="cph" type="tel" value="'+esc(j.phone||'')+'"><label>Email</label><input id="cem" type="email" value="'+esc(j.email||'')+'"><label>Address</label><input id="cad" value="'+esc(j.address||'')+'"><button class="btn gr" type="button" onclick="var s=document.getElementById(\'cadv\');s.hidden=!s.hidden">Advanced</button><div id="cadv" hidden><label>Secondary phone</label><input id="cph2" type="tel" value="'+esc(j.phone2||'')+'"><label>Secondary contact name</label><input id="cct2" value="'+esc(j.contact2||'')+'"></div><button class="btn huge" id="csave" type="button" onclick="saveCustomer()">Save customer</button></div>';armBack(function(){if(from==='Admin')aview(id);else mview(id)});window.scrollTo(0,0)}
async function saveCustomer(){var email=$('#cem').value.trim();if(email&&!validEmail(email))return toast('That email does not look right');if(!email)return toast('Customer email is required');var b=$('#csave');if(b){b.disabled=true;b.textContent='Saving…'}try{await api({a:'cedit',pin:myPin(),ids:window.CIDS||[],name:$('#cnm').value.trim(),phone:$('#cph').value.trim(),email:email,address:$('#cad').value.trim(),phone2:$('#cph2').value.trim(),contact2:$('#cct2').value.trim()});toast('Customer saved');await refresh();var id=(window.CIDS||[])[0];if(id&&role==='Admin')aview(id);else if(id)mview(id);else render()}catch(e){toast(String(e.message||e)==='Bad action'?'Editing needs a Field Desk script redeploy before it can be saved.':e.message);if(b){b.disabled=false;b.textContent='Save customer'}}}
async function saveEdit(send){var id=editId;if(!id)return;var d=Object.assign({a:'qedit',id:id,send:!!send,name:$('#nm')?$('#nm').value.trim():'',address:$('#ad')?$('#ad').value.trim():'',email:$('#em')?$('#em').value.trim():'',quote:$('#qt')?$('#qt').value:'',items:IT.filter(function(i){return i.title&&String(i.title).trim()})},quoteExtra());if(d.email&&!validEmail(d.email))return toast('That email does not look right');if(!d.email)return toast('Customer email is required');if(!d.items.length)return toast('Add at least one line');var b=send?$('#sq'):$('#sqsave');var other=send?$('#sqsave'):$('#sq');if(b){b.disabled=true;b.textContent=send?'Sending…':'Saving…'}if(other)other.disabled=true;try{await api(d);editId='';toast(send?'Updated estimate sent to '+d.email:'Quote saved');await refresh();if(role==='Admin')aview(id);else mview(id)}catch(e){toast(String(e.message||e)==='Bad action'?'Editing needs a Field Desk script redeploy before it can be saved.':e.message);if(b){b.disabled=false;b.textContent=send?'Send updated estimate':'Save'}if(other)other.disabled=false}}
async function saveInv(id){try{await api({a:'iedit',id:id,amount:$('#am').value,note:$('#an').value});toast('Invoice saved');await refresh();aview(id)}catch(e){toast(String(e.message||e)==='Bad action'?'Editing needs a Field Desk script redeploy before it can be saved.':e.message)}}
function openFb(){view='fb';feedbackScreen();window.scrollTo(0,0)}
function feedbackScreen(){A.innerHTML='<div class="card"><h2>Feedback</h2><p class="muted">Tell us what to change in Field Desk. This note is saved for the office. It is not emailed.</p><textarea id="fbtext" rows="6" placeholder="What should we change?"></textarea><button class="btn huge" id="fbsend" type="button" onclick="sendFeedback()">Send feedback</button></div>';armBack(function(){view='';render()})}
async function sendFeedback(){var text=$('#fbtext')?$('#fbtext').value.trim():'';if(!text)return toast('Write a note first');var b=$('#fbsend');if(b){b.disabled=true;b.textContent='Sending…'}try{await api({a:'feedback',pin:myPin(),role:role,text:text});if($('#fbtext'))$('#fbtext').value='';toast('Thank you. Your note was saved.')}catch(e){toast(String(e.message||e)==='Bad action'?'Feedback needs a Field Desk script redeploy before it can be saved.':e.message)}if(b){b.disabled=false;b.textContent='Send feedback'}}
function prev(){var spoken=$('#qt')?$('#qt').value.trim():'';var svc=$('#svc')?$('#svc').value:'';if(!spoken&&!svc)return toast('Say or type the work first');IT=FDForm.buildLines(formCfg(),svc,spoken?rewriteQuote(spoken):[]);drawPv()}
function drawPv(){var t=IT.reduce(function(a,i){return a+(Number(i.price)||0)},0);var face=FDForm.customerPreviewHtml(quoteFace(),formCfg());var sendBtn=editId?'<button class="btn huge" id="sqsave" type="button" onclick="saveEdit(false)">Save</button><button class="btn huge d" id="sq" type="button" onclick="saveEdit(true)">Send updated estimate</button>':'<button class="btn huge" id="sq" type="button" onclick="sendQ()">Send quote email + PDF</button>';$('#pv').innerHTML='<div class="card" style="border:3px solid var(--g)"><h2>Customer will see</h2><p class="muted">Edit anything. Blank price = Included. Internal notes are not in this box.</p>'+face+IT.map(function(i,n){return '<div style="border-bottom:1px solid #e6e9e0;padding:8px 0"><input value="'+esc(i.title)+'" oninput="IT['+n+'].title=this.value" style="font-weight:700"><textarea rows="2" oninput="IT['+n+'].detail=this.value" style="margin-top:6px;font-size:15px">'+esc(i.detail)+'</textarea><div class="row"><input inputmode="decimal" placeholder="Price" value="'+(i.price==null?'':i.price)+'" oninput="IT['+n+'].price=this.value===\'\'?null:Number(this.value.replace(/[$,]/g,\'\'));$(\'#tot\').textContent=money(IT.reduce(function(a,i){return a+(Number(i.price)||0)},0))"><button class="btn gr" style="margin:0;flex:0 0 90px" onclick="IT.splice('+n+',1);drawPv()">Remove</button></div></div>'}).join('')+'<button class="btn gr" onclick="IT.push({title:\'\',detail:\'\',price:null});drawPv()">+ Add line</button><p style="font-size:22px;text-align:right"><b>Total: <span id="tot">'+money(t)+'</span></b></p>'+sendBtn+'</div>';if(!editId)$('#pv').scrollIntoView({behavior:'smooth'})}
if(role)refresh().then(render);else render();
</script><script src="v5.js?v=20261027b"></script></body></html>
