<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>Pay your invoice - Fielder Tree Care &amp; Service</title>
<style>:root{--n:#112337;--g:#78a22f;--dg:#34460d}*{box-sizing:border-box}body{margin:0;background:#eef1ea;font:17px/1.5 Arial,Helvetica,sans-serif;color:#231f20}.pg{max-width:680px;margin:0 auto;background:#fff;min-height:100vh}
.hd{background:var(--n);color:#fff;padding:16px 18px;display:flex;align-items:center;gap:14px}.hd img{height:50px;background:#fff;border-radius:8px;padding:4px}.hd b{font-size:19px;display:block}.bar{height:6px;background:var(--g)}.in{padding:18px}h1{color:var(--n);font-size:24px;margin:0 0 6px}h2{color:var(--n);font-size:20px;margin:0 0 8px}
.box{border:2px solid #e3e7dc;border-radius:14px;padding:14px;margin:14px 0;background:#fafbf8}.btn{display:block;width:100%;padding:18px;font-size:20px;font-weight:bold;background:var(--g);color:#fff;border:0;border-radius:14px;cursor:pointer;margin:10px 0;text-align:center;text-decoration:none}.btn.n{background:var(--n)}.btn.o{background:#fff;color:var(--n);border:3px solid var(--n)}.btn.on{background:var(--g);color:#fff;border-color:var(--g)}.btn:disabled{opacity:.5}
.mu{color:#5b6168;font-size:15px}.ok{background:#eef5e3;border:2px solid var(--g);color:var(--dg);border-radius:14px;padding:16px;text-align:center;font-size:19px;font-weight:bold}.bad{color:#b42318;font-weight:bold}table{width:100%;border-collapse:collapse}td{padding:8px 4px;border-bottom:1px solid #eef0ea;vertical-align:top}td.p{text-align:right;white-space:nowrap}
input,textarea{width:100%;font-size:18px;padding:14px;border:2px solid #cfd6c4;border-radius:12px;margin:6px 0}canvas{width:100%;height:200px;border:2px dashed #112337;border-radius:12px;background:#fff;touch-action:none}.ph{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}.ph img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:8px}
.ft{padding:16px 18px;color:#5b6168;font-size:13px;border-top:1px solid #eee}a{color:var(--n)}</style></head><body><div class="pg"><div class="hd"><img src="logo.png" alt="Fielder Tree"><div><b>Fielder Tree Care &amp; Service</b><small>Pay online</small></div></div><div class="bar"></div><div id="m" class="in mu">Loading…</div>
<div class="ft">Fielder Tree Care &amp; Service · 1382 Timberlane Rd Suite C, Tallahassee, FL · <a href="tel:8506568737">(850) 656-8737</a> · office@fieldertree.com</div></div>
<script>var Q=new URLSearchParams(location.search),T=Q.get('t')||'',API=Q.get('api')||'/api/gas',M=document.getElementById('m');
function e(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function $m(n){return '$'+Number(n||0).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2})}
function call(o){o.t=T;return fetch(API,{method:'POST',headers:{'Content-Type':'text/plain'},body:JSON.stringify(o)}).then(function(r){return r.json()}).then(function(j){if(!j.ok)throw Error(j.err||'Please try again');return j})}
function err(t){M.innerHTML='<h1>Sorry</h1><p>'+e(t)+'</p><a class="btn n" href="tel:8506568737">Call (850) 656-8737</a>'}
function items(q){return '<table>'+q.items.map(function(i,n){return '<tr><td><b>'+e(i.title)+'</b>'+(i.detail?'<br><small class="mu">'+e(i.detail)+'</small>':'')+'</td><td class="p">'+(i.price==null?'Included':$m(i.price))+'</td></tr>'}).join('')+'</table><p style="text-align:right;font-size:21px">Total <b style="color:var(--dg)">'+$m(q.total)+'</b></p>'}
function dt(s){return new Date(s).toLocaleString('en-US',{month:'short',day:'numeric',year:'numeric',hour:'numeric',minute:'2-digit'})}
if(!T)err('This link is missing its code.');
</script><script>
function pay(b){b.disabled=true;b.textContent='Opening secure checkout…';call({a:'payStart'}).then(function(r){if(r.paid)return show(true);location.href=r.url}).catch(function(x){b.disabled=false;b.textContent='💳 Pay now';document.getElementById('pe').textContent=x.message})}
function show(paid,p){M.innerHTML=paid?'<div class="ok" id="paid">✓ Paid. Thank you!</div><a class="btn o" href="portal.html?t='+encodeURIComponent(T)+'">Open my project page</a>':'<h1>Invoice '+e(p.invoice.no)+'</h1><div class="mu">'+e(p.quote.name)+' · '+e(p.quote.address)+'</div><p style="font-size:26px">Amount due <b style="color:var(--dg)">'+$m(p.invoice.amount)+'</b></p>'+(p.payOn?'<button class="btn" id="pb" onclick="pay(this)">💳 Pay now</button><p class="mu">Card or bank transfer (ACH) through Stripe’s secure checkout.</p>':'<p class="bad" id="pe0">Online payment isn’t switched on yet.</p><a class="btn n" href="tel:8506568737">Call to pay by card</a>')+'<p class="bad" id="pe"></p>'}
if(T){var sid=Q.get('sid');(sid?call({a:'payConfirm',sid:sid}):Promise.resolve({})).then(function(c){if(c.paid)return show(true);return call({a:'portalInfo'}).then(function(r){var p=r.p;if(!p.invoice)return err('There is no invoice on this project yet.');show(p.invoice.paid,p)})}).catch(function(x){err(x.message)})}
</script></body></html>
